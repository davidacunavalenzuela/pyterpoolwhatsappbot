# =============================================================================
# Nginx como único punto de entrada (Cloudflare Tunnel -> nginx:80).
#
# Decisiones de seguridad:
#  - CSP restrictiva: el panel Astro solo ejecuta scripts propios (bundled) y
#    no usa CDNs, así que no hace falta habilitar orígenes externos.
#  - `client_max_body_size` acotado: los manuales PDF raramente pasan de 20 MB.
#  - Timeouts moderados: WhatsApp exige responder el webhook en <5 s; el
#    procesamiento real ocurre en el worker, así que 30 s es de sobra.
#  - Se confía en `CF-Connecting-IP` porque el tráfico llega por el túnel.
# =============================================================================

upstream api_backend {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;
    server_tokens off;

    # --- Compresión ---------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/wasm;

    # --- Headers de seguridad ----------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HSTS lo aplica Cloudflare; duplicarlo aquí no aporta y complica el dev local.

    # --- Webhook de WhatsApp ------------------------------------------------
    # Ruta exacta y sin cache: Meta reintenta y no debe recibir 304.
    location = /webhook {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # --- API del panel ------------------------------------------------------
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://api_backend/health;
        access_log off;
    }

    # --- Assets con hash: cache agresivo -----------------------------------
    # Se usa `expires` (no add_header) para no romper la herencia de los
    # headers de seguridad definidos a nivel de server.
    location /_astro/ {
        expires 1y;
        try_files $uri =404;
    }

    # --- Panel Astro (MPA estática) ----------------------------------------
    # try_files resuelve /products -> /products/index.html sin necesitar un
    # runtime de Node: el panel es HTML plano + fetch a la API.
    location / {
        expires -1;
        try_files $uri $uri/ $uri/index.html /index.html;
    }
}
